name: Modular FX Suite / GuidedTour Windows and actual JUCE screenshots
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Only superseded PR screenshot/build runs may cancel. Main and manual runs are protected.
concurrency:
  group: modularfx-guided-tour-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows-vst3:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Configure real plugin
        run: cmake -S . -B build -A x64
      - name: Build Windows VST3 only
        run: cmake --build build --config Release --parallel 2
      - name: Verify exactly one Windows VST3 bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bundleRoot = 'build/ModularFXSuite_artefacts/Release/VST3'
          $bundles = @(Get-ChildItem -LiteralPath $bundleRoot -Directory -Filter '*.vst3')
          if ($bundles.Count -ne 1) { throw "Expected exactly one Windows VST3 bundle, found $($bundles.Count)" }
          $plugin = $bundles[0]
          if ($plugin.Name -ne 'Modular FX Suite.vst3') { throw "Unexpected bundle name: $($plugin.Name)" }
          $module = Join-Path $plugin.FullName 'Contents/x86_64-win/Modular FX Suite.vst3'
          if (-not (Test-Path -LiteralPath $module -PathType Leaf)) { throw "Missing Windows x64 VST3 module: $module" }
          $moduleInfoPath = Join-Path $plugin.FullName 'Contents/Resources/moduleinfo.json'
          $moduleInfo = Get-Content -LiteralPath $moduleInfoPath -Raw | ConvertFrom-Json
          if ($moduleInfo.Name -ne 'Modular FX Suite' -or $moduleInfo.Version -ne '1.0.0') { throw 'VST3 module identity/version mismatch' }
          $standalone = @(Get-ChildItem -LiteralPath 'build' -Recurse -File -Filter 'ModularFXSuite.exe')
          if ($standalone.Count -gt 0) { throw 'Standalone executable is not part of the Windows VST3-only release target' }
  ui-tour:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install real-editor build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build xvfb xauth pkg-config libasound2-dev libjack-jackd2-dev \
            libfreetype6-dev libfontconfig1-dev libx11-dev libxext-dev \
            libxinerama-dev libxcursor-dev libxrandr-dev libxcomposite-dev \
            libxrender-dev libgl1-mesa-dev libglu1-mesa-dev libxkbcommon-dev \
            libxkbcommon-x11-dev libgtk-3-dev
      - name: Configure actual-editor test
        run: cmake -S . -B build-ui -G Ninja -DCMAKE_BUILD_TYPE=Release -DSKELL_RACK_UI_TOUR_SCREENSHOTS=ON
      - name: Build renderer
        run: cmake --build build-ui --target SkellRackTourScreenshots --parallel 2
      - name: Test four real screenshots
        run: |
          set -euo pipefail
          renderer=$(find build-ui -type f -name SkellRackTourScreenshots -executable | head -n 1)
          test -n "$renderer"
          xvfb-run -a -s '-screen 0 1920x1080x24' "$renderer" --output ui-tour-screenshots
          test "$(find ui-tour-screenshots -name '*.png' | wc -l)" -eq 4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ModularFXSuite-GuidedTour-Real-Editor
          path: ui-tour-screenshots/
          if-no-files-found: warn
          retention-days: 14
