name: Build VST3 Plugin

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]

    steps:
    - name: Checkout repository recursively
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Configure CMake
      run: >
        cmake -B build
        -DCMAKE_BUILD_TYPE=Release

    - name: Build Plugin and Preset Regression Target
      run: cmake --build build --config Release

    - name: Run Preset XML Regression
      run: ctest --test-dir build -C Release --output-on-failure

    # Package Windows build outputs as downloadable artifacts
    - name: Upload Windows VST3 Artifact
      if: runner.os == 'Windows'
      uses: actions/upload-artifact@v4
      with:
        name: ModularFXSuite-VST3-Windows
        path: build/ModularFXSuite_artefacts/Release/VST3/*.vst3

